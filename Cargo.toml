[workspace]
resolver = "3"
members = ["apps/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
http-body-util = "0.1"
jsonwebtoken = "9.3"
mime_guess = "2"
rust-embed = { version = "8.13", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "migrate",
  "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }

# 单二进制优先：体积与启动速度比极限吞吐更重要。
#
# 显式写 `strip = false`（而不是省略）：省略时 rustc 会对所有产物统一 strip，
# 在 macOS 上会把 proc-macro 的 dylib 剥坏，链接期报 "mis-aligned LINKEDIT string pool"。
# 体积改由 scripts/build.ts 在拿到最终二进制后用系统 strip 处理。
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = false
